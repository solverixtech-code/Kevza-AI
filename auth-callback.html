<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KevzaAI - Signing In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="login-reference-page">
    <main class="login-shell auth-reference-shell">
      <section class="login-form-panel auth-reference-panel">
        <div class="login-card auth-reference-card verify-card" data-auth-callback>
          <div class="login-heading auth-reference-heading">
            <h2>Signing you in</h2>
            <p data-auth-callback-message>Connecting your Google account...</p>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="auth.js"></script>
  </body>
</html>
